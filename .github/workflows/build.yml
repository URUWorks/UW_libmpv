# libmpv for Tero Subtitler, with the zip names Tero downloads.
#
# - Every month it looks for a new libmpv for Windows (shinchiro's
#   mpv-winbuild-cmake weekly builds). If there is one, it packages and
#   tests the x64 and ARM64 ones (they load, they have every function
#   UW_MPVPlayer uses, they play a video and an audio to the end), builds
#   and tests the macOS one (macos.yml) and only then publishes a release
#   (v<date of the build>) with them and the frozen builds.
# - Actions > Build > Run workflow does it now, also with no new build, or
#   with a given build ("upstream", for example 20261104). With "publish"
#   off the zips stay as artifacts of the run.
# - Windows ARM64 is tested on windows-11-arm. It's for an ARM64 Tero: the
#   x64 Tero on Windows ARM runs emulated and uses the x64 DLL.
#
# The frozen builds (not rebuilt, see frozen.yml) are in the release
# "frozen" and go in every release, so releases/latest/download has all.

name: Build

on:
  schedule:
    - cron: "0 7 2 * *"   # the 2nd of each month, 07:00 UTC
  workflow_dispatch:
    inputs:
      upstream:
        description: "shinchiro build (tag, for example 20261104), empty = the latest"
        type: string
        default: ""
      publish:
        description: "Publish a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build

env:
  UPSTREAM_REPO: shinchiro/mpv-winbuild-cmake

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      upstream: ${{ steps.check.outputs.upstream }}
    steps:
      - name: Look for a new build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream }}
        run: |
          if [ -z "$UPSTREAM" ]; then
            UPSTREAM=$(gh release view -R "$UPSTREAM_REPO" --json tagName -q .tagName)
          fi
          ours=$(gh release list -R "${{ github.repository }}" --json tagName,isLatest -q '.[] | select(.isLatest) | .tagName' || true)
          echo "upstream: $UPSTREAM, our latest release: ${ours:-none}"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ours" = "v$UPSTREAM" ]; then
            echo "Nothing new."
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: windows-latest
            python: x64
            zip: libmpv2_win64.zip
          - arch: aarch64
            os: windows-11-arm
            python: arm64
            zip: libmpv2_winarm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # a Python of the same architecture, so ctypes can load the DLL
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python }}

      # mpv-dev-<arch>-<date>-git-<hash>.7z, not the x86_64-v3 (AVX2) one
      - name: Download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.check.outputs.upstream }}" -R "$UPSTREAM_REPO" -p "mpv-dev-${{ matrix.arch }}-2*.7z"
          ls -la *.7z
          7z e -y -r *.7z libmpv-2.dll
          ls -la libmpv-2.dll

      - name: Test
        run: python tools/test_libmpv.py libmpv-2.dll

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path libmpv-2.dll -DestinationPath ${{ matrix.zip }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  # libmpv_macos.zip: universal, built from the sources and tested
  macos:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/macos.yml

  release:
    needs: [check, windows, macos]
    if: needs.check.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: ${{ needs.check.outputs.upstream }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: libmpv*
          merge-multiple: true

      - name: Frozen builds
        run: gh release download frozen -R "$REPO" -D out -p libmpv2_win64_legacy.zip -p libmpv_macos_legacy.zip

      - name: Release
        run: |
          ls -la out
          for z in libmpv2_win64.zip libmpv2_winarm64.zip libmpv_macos.zip libmpv2_win64_legacy.zip libmpv_macos_legacy.zip; do
            [ -f "out/$z" ] || { echo "missing $z"; exit 1; }
          done
          if gh release view "v$UPSTREAM" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "v$UPSTREAM" out/*.zip -R "$REPO" --clobber
          else
            gh release create "v$UPSTREAM" out/*.zip -R "$REPO" \
              --target "${{ github.sha }}" --title "libmpv $UPSTREAM" --latest \
              --notes "Windows (x64, ARM64): libmpv from the $UPSTREAM build of https://github.com/$UPSTREAM_REPO. macOS: universal libmpv (mpv 0.40.0) built from the sources of macos/sources.txt. The legacy builds (Windows 7/8.1, macOS 10.11-10.14) are the frozen ones."
          fi
